name: AD Me validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 harness/secret_scan.py
      - run: python3 scripts/check-deployment-hold.py
      - run: python3 harness/selftest.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 harness/validate_service_backlog.py
      - run: python3 harness/validate_handoff.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Real-DB E2E is run by the agent with disposable QA accounts; credentials are never in Git.
