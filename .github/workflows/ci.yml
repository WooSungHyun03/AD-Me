name: AD Me validation
# Validation only. There is deliberately no deployment workflow: deploys and hosted DB migrations need user approval
# (docs/handoff/RELEASE_MANIFEST.md checklist).
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 harness/secret_scan.py
      - run: python3 scripts/check-deployment-hold.py
      - run: python3 harness/selftest.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 harness/validate_service_backlog.py
      - run: python3 harness/production_readiness.py --check
      - run: python3 harness/validate_handoff.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 harness/secret_scan.py --bundle
  migrations:
    # Every migration applied from scratch to a disposable local Supabase, then E2E + direct-REST permission tests.
    # Uses only the throwaway keys of that local stack; no repository secrets.
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase@2 start
      - run: bash tests/ci-db.sh
      - if: always()
        run: python3 harness/secret_scan.py --artifacts
