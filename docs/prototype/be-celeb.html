function fmtCount(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "억";
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "만";
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "천";
  return String(n);
}

function fmtWon(n) {
  return n.toLocaleString("ko-KR") + "원";
}

function tokenize(q) {
  return q
    .toLowerCase()
    .split(/[#_\s,·/]+/)
    .map((t) => t.trim())
    .filter((t) => t.length >= 2);
}

function matchCreator(creator, tokens) {
  const hay = [creator.category, ...creator.tags, ...creator.keywords].join(" ").toLowerCase();
  const hits = tokens.filter((t) => hay.includes(t));
  return hits;
}

function daysLeft(date) {
  const end = new Date(date + "T23:59:59+09:00").getTime();
  const now = new Date("2026-11-23T12:00:00+09:00").getTime();
  return Math.max(0, Math.ceil((end - now) / 86400000));
}

function Avatar({ creator, size = 48 }) {
  const [a, b] = creator.hue;
  const initial = creator.name.replace(/[^가-힣A-Za-z]/g, "").slice(0, 1);
  return (
    <div
      className="shrink-0 rounded-full grid place-items-center text-white font-semibold select-none"
      style={{
        width: size,
        height: size,
        fontSize: size * 0.4,
        background: `linear-gradient(135deg, hsl(${a} 80% 58%), hsl(${b} 75% 45%))`,
        boxShadow: "inset 0 -2px 6px rgba(0,0,0,.18)",
      }}
      aria-hidden="true"
    >
      {initial}
    </div>
  );
}

function AnalysisPanel({ query, tokens }) {
  const steps = ["최신 영상 메타데이터 불러오는 중", "해시태그 클러스터 비교 중", "평균 조회수 가중치 적용 중"];
  const [step, setStep] = useState(0);
  useEffect(() => {
    const t1 = setTimeout(() => setStep(1), 260);
    const t2 = setTimeout(() => setStep(2), 520);
    return () => {
      clearTimeout(t1);
      clearTimeout(t2);
    };
  }, []);
  return (
    <div className="relative overflow-hidden rounded-2xl bg-white p-6 ring-1 ring-blue-200 shadow-lg shadow-blue-600/10">
      <div className="scan-line" aria-hidden="true" />
      <div className="flex items-center gap-3">
        <span className="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white">
          <Bot size={20} aria-hidden="true" />
        </span>
        <div className="min-w-0">
          <p className="font-semibold text-slate-900">AI가 조건을 분석하고 있습니다</p>
          <p className="truncate text-sm text-slate-500">“{query}”</p>
        </div>
        <Loader2 size={20} className="ml-auto animate-spin text-blue-600" aria-hidden="true" />
      </div>
      <div className="mt-5 flex flex-wrap gap-2">
        {tokens.map((t, i) => (
          <span
            key={t}
            className="token-pop inline-flex items-center gap-1 rounded-full bg-blue-50 px-3 py-1 text-sm font-medium text-blue-700"
            style={{ animationDelay: `${i * 90}ms` }}
          >
            <Hash size={13} aria-hidden="true" />
            {t}
          </span>
        ))}
      </div>
      <ol className="mt-5 grid gap-2 text-sm">
        {steps.map((s, i) => (
          <li key={s} className={`flex items-center gap-2 transition-colors duration-300 ${i <= step ? "text-slate-800" : "text-slate-300"}`}>
            {i < step ? (
              <CheckCircle2 size={16} className="text-emerald-500" aria-hidden="true" />
            ) : i === step ? (
              <Loader2 size={16} className="animate-spin text-blue-600" aria-hidden="true" />
            ) : (
              <Circle size={16} aria-hidden="true" />
            )}
            {s}
          </li>
        ))}
      </ol>
      <div className="mt-5 h-1.5 overflow-hidden rounded-full bg-slate-100">
        <div className="progress-fill h-full rounded-full bg-gradient-to-r from-blue-600 to-indigo-600" />
      </div>
    </div>
  );
}

function ExploreView({ onOpen, onChat }) {
  const [input, setInput] = useState("");
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [subRange, setSubRange] = useState("all");
  const [minViews, setMinViews] = useState(0);
  const [proOnly, setProOnly] = useState(false);
  const timer = useRef(null);

  const runSearch = (q) => {
    const text = q.trim();
    setInput(text);
    if (timer.current) clearTimeout(timer.current);
    if (!text) {
      setQuery("");
      setLoading(false);
      return;
    }
    setLoading(true);
    setQuery(text);
    timer.current = setTimeout(() => setLoading(false), 800);
  };

  useEffect(() => () => timer.current && clearTimeout(timer.current), []);

  const tokens = useMemo(() => tokenize(query), [query]);

  const results = useMemo(() => {
    const range = SUB_RANGES.find((r) => r.id === subRange);
    return CREATORS.map((c) => ({ c, hits: tokens.length ? matchCreator(c, tokens) : null }))
      .filter(({ c, hits }) => {
        if (hits && hits.length === 0) return false;
        if (c.subs < range.min || c.subs >= range.max) return false;
        if (c.avgViews < minViews) return false;
        if (proOnly && !c.pro) return false;
        return true;
      })
      .sort((a, b) => {
        if (a.c.pro !== b.c.pro) return a.c.pro ? -1 : 1;
        const ha = a.hits ? a.hits.length : 0;
        const hb = b.hits ? b.hits.length : 0;
        if (ha !== hb) return hb - ha;
        return b.c.avgViews - a.c.avgViews;
      });
  }, [tokens, subRange, minViews, proOnly]);

  const reset = () => {
    setSubRange("all");
    setMinViews(0);
    setProOnly(false);
    runSearch("");
  };

  return (
    <div>
      <section className="hero-bg relative overflow-hidden">
        <div className="mx-auto max-w-6xl px-4 sm:px-6 pt-14 pb-16 sm:pt-20 sm:pb-20">

            ✨ 매일 자동 크롤링 · AI 해시태그 분석 엔진
          </span>
          <h1 className="mt-6 max-w-3xl text-[2rem] leading-[1.25] sm:text-5xl sm:leading-[1.18] font-bold tracking-tight text-slate-900 text-balance">
            조건에 맞는 유튜브 인플루언서, AI가 3초 만에 찾아드립니다.
          </h1>
          <p className="mt-5 max-w-xl text-base sm:text-lg leading-relaxed text-slate-600">
            상품과 타깃을 문장으로 적으면 최근 영상의 해시태그와 조회수 흐름을 비교해 협업 후보를 골라 드립니다.
          </p>

          <form
            className="mt-9 max-w-3xl"
            onSubmit={(e) => {
              e.preventDefault();
              runSearch(input);
            }}
          >
            <label htmlFor="ai-search" className="sr-only">
              상품이나 원하는 조건
            </label>
            <div className="search-shell flex items-center gap-2 rounded-2xl bg-white p-2 pl-4 shadow-xl shadow-blue-900/5 ring-1 ring-slate-200 transition-all duration-300 focus-within:ring-2 focus-within:ring-blue-500">
              <Sparkles size={20} className="shrink-0 text-indigo-500" aria-hidden="true" />
              <input
                id="ai-search"
                value={input}
                onChange={(e) => setInput(e.target.value)}
                placeholder="예: 30대 직장인 대상 멀티비타민, 숏폼 리뷰"
                className="min-w-0 flex-1 bg-transparent py-3 text-base text-slate-900 placeholder:text-slate-400 outline-none"
              />
              <button
                type="submit"
                className="inline-flex shrink-0 items-center gap-1.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 px-4 sm:px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-blue-600/30 transition-all duration-300 hover:shadow-blue-600/50 hover:brightness-110 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2"
              >
                <Search size={16} aria-hidden="true" />
                <span className="hidden sm:inline">AI로 찾기</span>
              </button>
            </div>
          </form>
          <div className="mt-4 flex flex-wrap gap-2" aria-label="추천 키워드">
            {CHIPS.map((chip) => (
              <button
                key={chip}
                type="button"
                onClick={() => runSearch(chip)}
                className={`rounded-full px-3.5 py-1.5 text-sm transition-all duration-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 ${
                  query === chip
                    ? "bg-blue-600 text-white shadow-md shadow-blue-600/30"
                    : "bg-white/90 text-slate-700 ring-1 ring-slate-200 hover:ring-blue-300 hover:text-blue-700"
                }`}
              >
                {chip}
              </button>
            ))}
          </div>
        </div>
      </section>

      <section className="mx-auto max-w-6xl px-4 sm:px-6 py-10">
        <div className="sticky z-20 -mx-4 sm:mx-0 mb-8 border-y sm:border sm:rounded-2xl border-slate-200 bg-white/90 backdrop-blur px-4 py-3 shadow-sm" style={{ top: "calc(64px + env(safe-area-inset-top, 0px))" }}>
          <div className="flex flex-wrap items-center gap-x-5 gap-y-3">

                    subRange === r.id ? "bg-white text-slate-900 font-semibold shadow-sm" : "text-slate-500 hover:text-slate-800"
                  }`}
                >
                  {r.label}
                </button>
              ))}
            </div>
            <label className="flex items-center gap-2 text-sm text-slate-600">
              <span className="sr-only">최소 평균 조회수</span>
              <Eye size={15} aria-hidden="true" />
              <select
                id="min-views"
                value={minViews}
                onChange={(e) => setMinViews(Number(e.target.value))}
                className="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                {VIEW_MINS.map((v) => (
                  <option key={v.value} value={v.value}>
                    {v.label}
                  </option>
                ))}
              </select>
            </label>
            <button
              type="button"
              role="switch"
              aria-checked={proOnly}
              onClick={() => setProOnly((v) => !v)}
              className="flex items-center gap-2 text-sm text-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded-lg"
            >
              <span className={`relative h-6 w-11 rounded-full transition-all duration-300 ${proOnly ? "bg-gradient-to-r from-blue-600 to-indigo-600" : "bg-slate-300"}`}>
                <span className={`absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-all duration-300 ${proOnly ? "left-[22px]" : "left-0.5"}`} />
              </span>
              상위노출 PRO만 보기
            </button>
            <span className="ml-auto text-sm text-slate-500 tabular-nums">
              {loading ? "분석 중" : `${results.length}개 채널`}
            </span>
          </div>
        </div>

        {loading ? (
          <AnalysisPanel query={query} tokens={tokens.length ? tokens : [query]} />
        ) : results.length ? (
          <>

      return;
    }

    setApplied((a) => ({ ...a, [job.id]: true }));
    setJobs((js) => js.map((j) => (j.id === job.id ? { ...j, applicants: j.applicants + 1 } : j)));
    notify(`${job.brand} 공고에 지원했습니다. 지원권 1매를 사용했습니다.`);
  };

  return (

        >
          <Plus size={17} aria-hidden="true" />
          광고 모집 공고 등록하기 (유료)
        </button>
      </div>

      <div className="mt-8 flex flex-wrap items-center gap-3 rounded-2xl bg-white px-5 py-4 ring-1 ring-slate-200">
        <span className="grid h-10 w-10 place-items-center rounded-xl bg-blue-50 text-blue-600">
          <Ticket size={19} aria-hidden="true" />
        </span>
        <div>
          <p className="text-sm text-slate-500">내 채널 · 자취생 노트</p>
          <p className="font-semibold text-slate-900">
            보유 지원권 <span className={`tabular-nums text-xl ml-1 transition-colors duration-300 ${tickets === 0 ? "text-rose-500" : "text-blue-700"}`}>{tickets}</span>매
          </p>

        <p className="ml-auto text-xs text-slate-500">지원 1건당 1매가 사용됩니다.</p>
      </div>

      <div className="mt-6 grid gap-4">
        {jobs.map((job) => {
          const done = applied[job.id];
          const left = daysLeft(job.deadline);
          return (
            <article
              key={job.id}
              className={`grid gap-5 rounded-2xl bg-white p-5 sm:p-6 ring-1 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl md:grid-cols-[1fr_auto] md:items-center ${
                job.fresh ? "ring-blue-300 fresh-in" : "ring-slate-200"

            >
              <div className="min-w-0">
                <div className="flex flex-wrap items-center gap-2 text-sm">

                  <span className="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600">{job.category}</span>
                  {job.fresh && <span className="rounded bg-blue-600 px-1.5 py-0.5 text-xs font-medium text-white">방금 등록</span>}

                </div>

                <dl className="mt-4 grid grid-cols-2 gap-x-6 gap-y-3 sm:grid-cols-4 text-sm">

                  <div>

function ChatView({ chats, setChats, activeId, setActiveId, onOpen }) {
  const [draft, setDraft] = useState("");
  const endRef = useRef(null);
  const active = chats.find((c) => c.id === activeId) || chats[0];
  const creator = CREATORS.find((c) => c.id === active.creatorId);

  useEffect(() => {
    if (endRef.current) endRef.current.scrollIntoView({ block: "end", behavior: "smooth" });
  }, [active.messages.length, active.id]);

  const now = () => {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  const send = () => {
    const text = draft.trim();
    if (!text) return;
    const id = active.id;
    setChats((cs) => cs.map((c) => (c.id === id ? { ...c, messages: [...c.messages, { from: "me", text, time: now() }] } : c)));
    setDraft("");
    setTimeout(() => {
      setChats((cs) =>
        cs.map((c) =>
          c.id === id
            ? { ...c, messages: [...c.messages, { from: "them", text: "확인했습니다. 내부 일정 보고 오늘 중으로 답변드릴게요.", time: now(), auto: true }] }
            : c,
        ),
      );
    }, 1400);
  };

  const toggle = (i) => {
    setChats((cs) =>
      cs.map((c) =>
        c.id === active.id ? { ...c, checklist: c.checklist.map((item, j) => (j === i ? { ...item, done: !item.done } : item)) } : c,
      ),
    );
  };

  const groups = [
    { key: "job", label: "공고 지원" },
    { key: "ai", label: "AI 검색 제안" },
  ];
  const progress = active.checklist.filter((i) => i.done).length;

  return (
    <div className="mx-auto max-w-7xl px-4 sm:px-6 py-8">
      <div className="grid overflow-hidden rounded-3xl bg-white ring-1 ring-slate-200 shadow-sm lg:grid-cols-[280px_1fr_300px]" style={{ minHeight: 620 }}>
        <aside className="border-b lg:border-b-0 lg:border-r border-slate-200 bg-slate-50/60">
          <div className="px-5 py-4 border-b border-slate-200">
            <h1 className="font-bold text-slate-900">딜 채팅</h1>
          </div>
          <div className="max-h-64 lg:max-h-none overflow-y-auto">
            {groups.map((g) => (
              <div key={g.key} className="py-2">
                <p className="px-5 py-1.5 text-xs font-medium text-slate-500">{g.label}</p>
                {chats
                  .filter((c) => c.source === g.key)
                  .map((c) => {
                    const cr = CREATORS.find((x) => x.id === c.creatorId);
                    const last = c.messages[c.messages.length - 1];
                    const on = c.id === active.id;
                    return (
                      <button
                        key={c.id}
                        type="button"
                        onClick={() => setActiveId(c.id)}
                        className={`flex w-full items-center gap-3 px-5 py-3 text-left transition-all duration-300 focus-visible:outline-none focus-visible:bg-blue-50 ${
                          on ? "bg-white shadow-[inset_3px_0_0_#2563EB]" : "hover:bg-white/70"
                        }`}
                      >
                        <Avatar creator={cr} size={38} />
                        <span className="min-w-0 flex-1">
                          <span className="flex items-center justify-between gap-2">
                            <span className="truncate text-sm font-semibold text-slate-900">{cr.name}</span>
                            <span className="shrink-0 text-[11px] text-slate-400">{last.time}</span>
                          </span>
                          <span className="block truncate text-xs text-slate-500">{last.text}</span>
                        </span>
                      </button>
                    );
                  })}
              </div>
            ))}
          </div>
        </aside>

        <section className="flex min-w-0 flex-col" aria-label="대화">
          <header className="flex items-center gap-3 border-b border-slate-200 px-5 py-3.5">
            <button type="button" onClick={() => onOpen(creator)} className="flex min-w-0 items-center gap-3 text-left group">
              <Avatar creator={creator} size={36} />
              <span className="min-w-0">
                <span className="block truncate font-semibold text-slate-900 group-hover:text-blue-700">{creator.name}</span>
                <span className="block truncate text-xs text-slate-500">{active.jobTitle}</span>
              </span>
            </button>
            <span className={`ml-auto shrink-0 rounded-full px-2.5 py-1 text-xs font-medium ${active.source === "job" ? "bg-emerald-50 text-emerald-700" : "bg-indigo-50 text-indigo-700"}`}>
              {active.source === "job" ? "공고 지원" : "AI 제안"}
            </span>
          </header>
          <div className="flex-1 space-y-3 overflow-y-auto bg-slate-50/50 px-5 py-6" style={{ maxHeight: 480 }}>
            {active.messages.map((m, i) => (
              <div key={i} className={`bubble-in flex items-end gap-2 ${m.from === "me" ? "justify-end" : "justify-start"}`}>
                {m.from === "me" && <span className="text-[11px] text-slate-400">{m.time}</span>}
                <p
                  className={`max-w-[78%] whitespace-pre-wrap break-words rounded-2xl px-4 py-2.5 text-sm leading-relaxed ${
                    m.from === "me"
                      ? "rounded-br-md bg-gradient-to-br from-blue-600 to-indigo-600 text-white"
                      : "rounded-bl-md bg-white text-slate-800 ring-1 ring-slate-200"
                  }`}
                >
                  {m.text}
                  {m.auto && <span className="mt-1 block text-[10px] text-slate-400">데모 자동 응답</span>}
                </p>
                {m.from === "them" && <span className="text-[11px] text-slate-400">{m.time}</span>}
              </div>
            ))}
            <div ref={endRef} />
          </div>
          <form
            className="flex items-end gap-2 border-t border-slate-200 p-3"
            onSubmit={(e) => {
              e.preventDefault();
              send();
            }}
          >
            <label htmlFor="chat-input" className="sr-only">메시지</label>
            <textarea
              id="chat-input"
              rows={1}
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && !e.shiftKey && !e.nativeEvent.isComposing) {
                  e.preventDefault();
                  send();
                }
              }}
              placeholder="메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"
              className="min-h-[44px] max-h-32 flex-1 resize-none rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              type="submit"
              disabled={!draft.trim()}
              className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white transition-all duration-300 hover:brightness-110 disabled:opacity-40"
              aria-label="전송"
            >
              <Send size={18} />
            </button>
          </form>
        </section>

        <aside className="border-t lg:border-t-0 lg:border-l border-slate-200 p-5" aria-label="계약 요약">
          <h2 className="text-sm font-semibold text-slate-900">계약 요약</h2>
          <dl className="mt-4 grid grid-cols-2 gap-3">
            <div className="rounded-xl bg-slate-50 px-3 py-2.5">
              <dt className="text-[11px] text-slate-500">구독자</dt>
              <dd className="mt-0.5 font-semibold text-slate-900 tabular-nums">{fmtCount(creator.subs)}</dd>
            </div>
            <div className="rounded-xl bg-slate-50 px-3 py-2.5">
              <dt className="text-[11px] text-slate-500">30일 평균 조회</dt>
              <dd className="mt-0.5 flex items-baseline gap-1">
                <span className="font-semibold text-slate-900 tabular-nums">{fmtCount(creator.avgViews)}</span>
                <Growth value={creator.growth} />
              </dd>
            </div>
          </dl>
          <div className="mt-4 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 p-4 text-white">
            <p className="text-xs text-blue-100">협의 단가</p>
            <p className="mt-1 text-2xl font-bold tabular-nums">{fmtWon(active.price)}</p>
            <p className="mt-2 flex items-center gap-1.5 text-xs text-blue-100">
              <Calendar size={13} aria-hidden="true" />
              {active.schedule}
            </p>
          </div>
          <div className="mt-6">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-semibold text-slate-900">진행 체크리스트</h3>
              <span className="text-xs text-slate-500 tabular-nums">{progress}/{active.checklist.length}</span>
            </div>
            <div className="mt-2 h-1.5 overflow-hidden rounded-full bg-slate-100">
              <div
                className="h-full rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 transition-all duration-500"
                style={{ width: `${(progress / active.checklist.length) * 100}%` }}
              />
            </div>
            <ul className="mt-3 grid gap-1">
              {active.checklist.map((item, i) => (
                <li key={item.label}>
                  <button
                    type="button"
                    onClick={() => toggle(i)}
                    aria-pressed={item.done}
                    className="flex w-full items-center gap-2.5 rounded-lg px-2 py-2 text-left text-sm transition-colors hover:bg-slate-50"
                  >
                    {item.done ? (
                      <CheckCircle2 size={18} className="shrink-0 text-blue-600" aria-hidden="true" />
                    ) : (
                      <Circle size={18} className="shrink-0 text-slate-300" aria-hidden="true" />
                    )}
                    <span className={item.done ? "text-slate-400 line-through" : "text-slate-700"}>{item.label}</span>
                  </button>
                </li>
              ))}
            </ul>
          </div>
        </aside>
      </div>
    </div>
  );
}

                    : p.featured
                      ? "bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-600/30 hover:brightness-110"
                      : "bg-slate-900 text-white hover:bg-blue-700"
                }`}
              >
                {p.cta}
              </button>
            </article>
          ))}
          <p className="text-xs text-slate-500">데모 화면입니다. 실제 결제는 진행되지 않습니다.</p>
        </div>
      </div>
    </div>
  );
}

function ProfileDrawer({ creator, onClose, onChat, notify }) {
  const open = Boolean(creator);
  const [shown, setShown] = useState(creator);
  useEffect(() => {
    if (creator) setShown(creator);
  }, [creator]);
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, onClose]);

  const c = shown;
  const copy = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
      } catch (err) {
        /* selection stays for manual copy */
      }
      document.body.removeChild(ta);
    }
    notify("복사되었습니다!");
  };
  const months = ["6월", "7월", "8월", "9월", "10월", "11월"];
  const max = c ? Math.max(...c.trend) : 1;

  return (
    <div className={`fixed inset-0 z-[60] ${open ? "" : "pointer-events-none"}`} aria-hidden={!open}>
      <div className={`absolute inset-0 bg-slate-900/30 backdrop-blur-[2px] transition-opacity duration-300 ${open ? "opacity-100" : "opacity-0"}`} onClick={onClose} />
      <aside
        role="dialog"
        aria-modal="true"
        aria-label={c ? `${c.name} 상세 프로필` : "상세 프로필"}
        className={`absolute right-0 top-0 flex h-full w-full max-w-md flex-col bg-white shadow-2xl transition-transform duration-300 ease-out ${
          open ? "translate-x-0" : "translate-x-full"
        }`}
        style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}
      >
        {c && (
          <>
            <div className="flex-1 overflow-y-auto">
              <div className="relative h-28 bg-gradient-to-br from-blue-600 to-indigo-600">
                <button
                  type="button"
                  onClick={onClose}
                  className="absolute right-4 top-4 rounded-full bg-white/20 p-2 text-white backdrop-blur hover:bg-white/30"
                  aria-label="프로필 닫기"
                >
                  <X size={18} />
                </button>
              </div>
              <div className="px-6">
                <div className="-mt-10 flex items-end gap-4">
                  <div className="rounded-full ring-4 ring-white">
                    <Avatar creator={c} size={80} />
                  </div>
                  {c.pro && <div className="pb-2"><ProBadge small /></div>}
                </div>
                <h2 className="mt-3 text-xl font-bold text-slate-900">{c.name}</h2>
                <p className="text-sm text-slate-500">{c.handle} · {c.category}</p>
                <p className="mt-3 text-sm leading-relaxed text-slate-600">{c.bio}</p>
                <div className="mt-4 flex items-center justify-between rounded-xl bg-slate-50 px-4 py-3 ring-1 ring-slate-200">
                  <span className="flex items-center gap-2 text-sm text-slate-700">
                    <Youtube size={18} className="text-red-600" aria-hidden="true" />
                    youtube.com/{c.handle}
                  </span>
                  <span className="inline-flex items-center gap-1 text-xs text-slate-400">
                    채널 바로가기 <ExternalLink size={12} aria-hidden="true" />
                  </span>
                </div>

                <dl className="mt-5 grid grid-cols-3 gap-2">
                  <div className="rounded-xl bg-slate-50 px-3 py-2.5">
                    <dt className="text-[11px] text-slate-500">구독자</dt>
                    <dd className="mt-0.5 font-semibold text-slate-900 tabular-nums">{fmtCount(c.subs)}</dd>
                  </div>
                  <div className="rounded-xl bg-slate-50 px-3 py-2.5">
                    <dt className="text-[11px] text-slate-500">30일 평균</dt>
                    <dd className="mt-0.5 font-semibold text-slate-900 tabular-nums">{fmtCount(c.avgViews)}</dd>
                  </div>
                  <div className="rounded-xl bg-slate-50 px-3 py-2.5">
                    <dt className="text-[11px] text-slate-500">예상 단가</dt>
                    <dd className="mt-0.5 font-semibold text-slate-900 tabular-nums">{fmtCount(c.price)}원</dd>
                  </div>
                </dl>

                <section className="mt-7">
                  <div className="flex items-center justify-between">
                    <h3 className="flex items-center gap-1.5 text-sm font-semibold text-slate-900">
                      <BarChart3 size={16} className="text-blue-600" aria-hidden="true" />
                      30일 평균 조회수 추이
                    </h3>
                    <Growth value={c.growth} />
                  </div>
                  <div className="mt-4 flex h-40 items-end gap-2.5 border-b border-slate-200 pb-0" role="img" aria-label={`최근 6개월 30일 평균 조회수: ${c.trend.map(fmtCount).join(", ")}`}>
                    {c.trend.map((v, i) => {
                      const last = i === c.trend.length - 1;
                      return (
                        <div key={i} className="flex h-full flex-1 flex-col items-center justify-end gap-1">
                          <span className={`text-[10px] tabular-nums ${last ? "font-semibold text-blue-700" : "text-slate-400"}`}>{fmtCount(v)}</span>
                          <div
                            className={`bar-grow w-full rounded-t-md ${last ? "bg-gradient-to-t from-blue-600 to-indigo-500" : "bg-blue-100"}`}
                            style={{ height: `${(v / max) * 82}%`, animationDelay: `${i * 60}ms` }}
                          />
                        </div>
                      );
                    })}
                  </div>
                  <div className="mt-1.5 flex gap-2.5">
                    {months.map((m) => (
                      <span key={m} className="flex-1 text-center text-[11px] text-slate-500">{m}</span>
                    ))}
                  </div>
                </section>

                <section className="mt-7 rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 p-4 ring-1 ring-blue-100">
                  <h3 className="flex items-center gap-1.5 text-sm font-semibold text-slate-900">
                    <Bot size={16} className="text-indigo-600" aria-hidden="true" />
                    AI 일일 크롤링 리포트
                  </h3>
                  <p className="mt-1 text-xs text-slate-600">매일 최신 영상을 분석해 자동 생성된 해시태그입니다.</p>
                  <div className="mt-3 flex flex-wrap gap-1.5">
                    {[...c.tags, ...c.keywords.slice(0, 3)].map((t) => (
                      <span key={t} className="rounded-full bg-white px-2.5 py-1 text-xs text-blue-700 ring-1 ring-blue-100">#{t}</span>
                    ))}
                  </div>
                  <p className="mt-3 text-[11px] text-slate-500">마지막 분석 2026.11.23 06:00</p>
                </section>

                <section className="mt-7 mb-6">
                  <h3 className="text-sm font-semibold text-slate-900">직거래 연락처</h3>
                  <div className="mt-3 grid gap-2">
                    {[
                      { icon: Mail, label: "이메일", value: c.email },
                      { icon: MessageCircle, label: "카카오톡 ID", value: c.kakao },
                    ].map(({ icon: Icon, label, value }) => (
                      <div key={label} className="flex items-center gap-3 rounded-xl px-4 py-3 ring-1 ring-slate-200">
                        <Icon size={17} className="shrink-0 text-slate-400" aria-hidden="true" />
                        <span className="min-w-0 flex-1">
                          <span className="block text-[11px] text-slate-500">{label}</span>
                          <span className="block truncate text-sm font-medium text-slate-800 select-all">{value}</span>
                        </span>
                        <button
                          type="button"
                          onClick={() => copy(value)}
                          className="inline-flex shrink-0 items-center gap-1 rounded-lg bg-slate-100 px-2.5 py-1.5 text-xs font-medium text-slate-700 transition-colors hover:bg-blue-50 hover:text-blue-700"
                        >
                          <Copy size={13} aria-hidden="true" />
                          복사
                        </button>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            </div>
            <div className="border-t border-slate-200 bg-white p-4" style={{ paddingBottom: "calc(16px + env(safe-area-inset-bottom, 0px))" }}>
              <button
                type="button"
                onClick={() => onChat(c)}
                className="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 py-3.5 text-sm font-semibold text-white shadow-lg shadow-blue-600/30 transition-all duration-300 hover:brightness-110"
              >
                <MessageCircle size={17} aria-hidden="true" />
                1:1 채팅으로 광고 제안하기
              </button>
            </div>
          </>
        )}
      </aside>
    </div>
  );
}

function App() {
  const [view, setView] = useState("explore");
  const [profile, setProfile] = useState(null);
  const [toast, setToast] = useState("");
  const [tickets, setTickets] = useState(3);
  const [chats, setChats] = useState(INITIAL_CHATS);
  const [activeChat, setActiveChat] = useState(INITIAL_CHATS[0].id);
  const toastTimer = useRef(null);

  const notify = (msg) => {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  };

  const go = (v) => {
    setView(v);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const openChat = (creator) => {
    const existing = chats.find((c) => c.creatorId === creator.id);
    if (existing) {
      setActiveChat(existing.id);
    } else {
      const id = "t" + Date.now();
      setChats((cs) => [
        ...cs,
        {
          id,
          creatorId: creator.id,
          source: "ai",
          jobTitle: "AI 검색 제안 · 새 대화",
          price: creator.price,
          messages: [{ from: "them", text: `안녕하세요, ${creator.name}입니다. 어떤 제품 협업을 생각하고 계신가요?`, time: "방금" }],
          checklist: [
            { label: "콘텐츠 구성안 공유", done: false },
            { label: "단가 확정", done: false },
            { label: "제품 발송", done: false },
            { label: "초안 검수", done: false },
            { label: "업로드 및 링크 전달", done: false },
          ],
          schedule: "일정 협의 전",
        },
      ]);
      setActiveChat(id);
    }
    setProfile(null);
    go("chat");
  };

  return (
    <div className="min-h-full bg-[#F8FAFC] font-sans text-slate-900 antialiased">
      <header className="sticky z-40 border-b border-slate-200/80 bg-white/85 backdrop-blur" style={{ top: "env(safe-area-inset-top, 0px)" }}>
        <div className="mx-auto flex h-16 max-w-7xl items-center gap-4 px-4 sm:px-6">
          <button type="button" onClick={() => go("explore")} className="flex shrink-0 items-center gap-2" aria-label="Be-Celeb 홈">
            <span className="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 text-white">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 6.5v11l9-5.5-9-5.5Z" fill="currentColor" />
                <circle cx="18.5" cy="5.5" r="2.2" fill="#FDE68A" />
              </svg>
            </span>
            <span className="text-lg font-bold tracking-tight">Be-Celeb</span>
          </button>
          <nav className="tab-scroll -mb-px flex flex-1 items-stretch gap-1 overflow-x-auto self-stretch" aria-label="주요 화면">
            {TABS.map((t) => {
              const Icon = t.icon;
              const on = view === t.id;
              return (
                <button
                  key={t.id}
                  type="button"
                  onClick={() => go(t.id)}
                  aria-current={on ? "page" : undefined}
                  className={`relative flex shrink-0 items-center gap-1.5 px-3 text-sm transition-all duration-300 focus-visible:outline-none focus-visible:bg-blue-50 ${
                    on ? "font-semibold text-blue-700" : "text-slate-500 hover:text-slate-900"
                  }`}
                >
                  <Icon size={16} aria-hidden="true" />
                  {t.label}
                  {t.id === "chat" && (
                    <span className="rounded-full bg-blue-600 px-1.5 text-[10px] font-semibold text-white tabular-nums">{chats.length}</span>
                  )}
                  <span className={`absolute inset-x-2 bottom-0 h-0.5 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 transition-all duration-300 ${on ? "opacity-100" : "opacity-0"}`} />
                </button>
              );
            })}
          </nav>
          <span className="hidden md:inline-flex shrink-0 items-center gap-1 rounded-full bg-slate-100 px-3 py-1.5 text-xs text-slate-600">
            <Ticket size={13} aria-hidden="true" />
            지원권 <strong className="tabular-nums text-slate-900">{tickets}</strong>
          </span>
        </div>
      </header>

      <main key={view} className="view-in">
        {view === "explore" && <ExploreView onOpen={setProfile} onChat={openChat} />}
        {view === "jobs" && <JobsView tickets={tickets} setTickets={setTickets} notify={notify} />}
        {view === "chat" && (
          <ChatView chats={chats} setChats={setChats} activeId={activeChat} setActiveId={setActiveChat} onOpen={setProfile} />
        )}
        {view === "membership" && <MembershipView notify={notify} setTickets={setTickets} />}
      </main>

      <footer className="mx-auto max-w-7xl px-4 sm:px-6 py-10 text-xs text-slate-500">
        Be-Celeb 프로토타입 · 화면의 채널, 수치, 연락처는 모두 가상 예시 데이터입니다.
      </footer>

      <ProfileDrawer creator={profile} onClose={() => setProfile(null)} onChat={openChat} notify={notify} />
      <Toast toast={toast} />

      <style>{`
        .pro-glow {
          border: 1.5px solid transparent;
          background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #2563EB, #4F46E5 45%, #F5C451) border-box;
          box-shadow: 0 8px 28px -10px rgba(37, 99, 235, .35), 0 0 0 4px rgba(245, 196, 81, .08);
        }
        .hero-bg {
          background:
            radial-gradient(900px 380px at 85% -10%, rgba(79, 70, 229, .14), transparent 60%),
            radial-gradient(700px 320px at 0% 110%, rgba(37, 99, 235, .10), transparent 60%),
            #F8FAFC;
        }
        .hero-bg::after {
          content: "";
          position: absolute;
          inset: 0;
          background-image: linear-gradient(rgba(15, 23, 42, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(15, 23, 42, .04) 1px, transparent 1px);
          background-size: 44px 44px;
          mask-image: linear-gradient(180deg, #000 0%, transparent 85%);
          pointer-events: none;
        }
        .hero-bg > * { position: relative; z-index: 1; }
        .text-balance { text-wrap: balance; }
        .tab-scroll { scrollbar-width: none; }
        .tab-scroll::-webkit-scrollbar { display: none; }
        @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .ticker-track { animation: ticker 38s linear infinite; }
        .ticker-track:hover { animation-play-state: paused; }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(900%); } }
        .scan-line { position: absolute; inset: 0 0 auto 0; height: 40px; background: linear-gradient(180deg, transparent, rgba(37, 99, 235, .10), transparent); animation: scan 1.1s ease-in-out infinite; pointer-events: none; }
        @keyframes progress { from { width: 4%; } to { width: 100%; } }
        .progress-fill { animation: progress .8s cubic-bezier(.4, 0, .2, 1) forwards; }
        @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.92); } to { opacity: 1; transform: none; } }
        .token-pop { animation: pop .3s ease-out both; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .results-in > * { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
        .results-in > *:nth-child(2) { animation-delay: 50ms; }
        .results-in > *:nth-child(3) { animation-delay: 100ms; }
        .results-in > *:nth-child(4) { animation-delay: 150ms; }
        .results-in > *:nth-child(5) { animation-delay: 200ms; }
        .results-in > *:nth-child(6) { animation-delay: 250ms; }
        .results-in > *:nth-child(n+7) { animation-delay: 300ms; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .view-in { animation: fade .3s ease-out; }
        .fade-in { animation: fade .2s ease-out; }
        .modal-in { animation: rise .3s cubic-bezier(.2, .7, .2, 1); }
        .bubble-in { animation: rise .25s ease-out both; }
        .fresh-in { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
        @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        .bar-grow { transform-origin: bottom; animation: grow .5s cubic-bezier(.2, .7, .2, 1) both; }
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
          .ticker-track { animation: none; flex-wrap: wrap; width: auto; }
        }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
